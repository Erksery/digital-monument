services:
  postgres:
    image: postgres:17-alpine
    container_name: digital-monument-postgres

    environment:
      POSTGRES_DB: digital-monument-database
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d digital-monument-database"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: erksery/digital-monument-api:latest

    build:
      context: ./digital-monument-api
      dockerfile: Dockerfile

    container_name: digital-monument-api

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD}@postgres:5432/digital-monument-database
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: erksery/digital-monument-client:latest

    build:
      context: ./digital-monument-client
      dockerfile: Dockerfile

    container_name: digital-monument-client

    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: digital-monument-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api
      - client

volumes:
  postgres_data:
  uploads_data:
